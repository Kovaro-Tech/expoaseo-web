<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f75bc" />

    <title>EXPOASEO | Servicios profesionales de limpieza en Loja</title>
    <meta
      name="description"
      content="Limpieza profesional para hogares, oficinas e instituciones en Loja y provincia. Elige el servicio, escríbenos por WhatsApp y coordinamos tu limpieza."
    />

    <!-- Open Graph (reemplazar /og-image.jpg cuando tengamos material gráfico) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta
      property="og:title"
      content="EXPOASEO | Servicios profesionales de limpieza en Loja"
    />
    <meta
      property="og:description"
      content="Hogares, empresas e instituciones en Loja y provincia. Solicita tu limpieza por WhatsApp."
    />

    <!--
      Ficha de negocio local para buscadores.
      ► Mantener en sync con src/config/business.js si cambian los datos.
      No se añade "openingHours" porque falta confirmar los DÍAS de atención.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CleaningService",
        "name": "EXPOASEO",
        "legalName": "EXPOASEO SERVICIOS GENERALES CIA LTDA",
        "description": "Servicios profesionales de limpieza para hogares, oficinas e instituciones en Loja y provincia.",
        "telephone": "+593989869808",
        "email": "expoaseoec@gmail.com",
        "areaServed": { "@type": "AdministrativeArea", "name": "Loja, Ecuador" },
        "address": { "@type": "PostalAddress", "addressLocality": "Loja", "addressCountry": "EC" },
        "sameAs": [
          "https://instagram.com/expoaseo",
          "https://www.tiktok.com/@expoaseo"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
