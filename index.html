<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f75bc" />

    <script>
      ;(() => {
        let savedTheme
        try {
          savedTheme = localStorage.getItem('expoaseo-theme')
        } catch {}
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#0b1725' : '#0f75bc'
      })()
    </script>

    <title>EXPOASEO | Servicios generales con cobertura nacional</title>
    <meta
      name="description"
      content="Limpieza, jardinería, fin de obra y fumigación para hogares, empresas e instituciones con cobertura nacional desde Loja."
    />

    <!-- Open Graph (reemplazar /og-image.jpg cuando tengamos material gráfico) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta
      property="og:title"
      content="EXPOASEO | Servicios generales con cobertura nacional"
    />
    <meta
      property="og:description"
      content="Limpieza, jardinería, fin de obra y fumigación con cobertura nacional. Solicita tu cotización por WhatsApp."
    />

    <!--
      Ficha de negocio local para buscadores.
      ► Mantener en sync con src/config/business.js si cambian los datos.
      No se añade "openingHours" porque falta confirmar los DÍAS de atención.
    -->

        "description": "Servicios de limpieza, jardinería, fin de obra y fumigación para hogares, empresas e instituciones con cobertura nacional desde Loja.",
        "telephone": "+593989869808",

        "areaServed": { "@type": "Country", "name": "Ecuador" },

        "sameAs": [
          "https://instagram.com/expoaseo",

        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
